<div class="login-container">

  <div class="login-box">
    <h2>SmartBoard Login</h2>

    <!-- EMAIL -->
    <div class="input-wrapper">
      <input type="email"
             [(ngModel)]="email"
             placeholder="Email"
             [class.error-input]="emailError" />
      <span class="error-inside" *ngIf="emailError">
        {{ emailError }}
      </span>
    </div>

    <!-- PASSWORD WITH TOGGLE -->
    <div class="input-wrapper password-field">

      <input
        [type]="showPassword ? 'text' : 'password'"
        [(ngModel)]="password"
        placeholder="Password"
        [class.error-input]="passwordError"
      />

      <span class="toggle-eye" (click)="togglePassword()">
        {{ showPassword ? '🙈' : '👁️' }}
      </span>

      <span class="error-inside" *ngIf="passwordError">
        {{ passwordError }}
      </span>

    </div>

    <!-- FORGOT PASSWORD -->
    <p class="forgot-link" (click)="openForgotModal()">
      Forgot Password?
    </p>

    <!-- LOGIN BUTTON -->
    <form (ngSubmit)="login()">
      <button type="submit">Login</button>
    </form>

    <p class="switch">
      Don't have an account?
      <span (click)="goToRegister()">Register</span>
    </p>

  </div>

</div>

<!-- ================= FORGOT PASSWORD MODAL ================= -->

<div class="modal-backdrop" *ngIf="showForgotModal">

  <div class="modal-box">

    <h3>Reset Password</h3>

    <!-- EMAIL -->
    <input
      placeholder="Enter your email"
      [(ngModel)]="resetEmail"
    />

    <button (click)="sendOTP()">Send OTP</button>

    <!-- OTP SECTION -->
    <div *ngIf="otpSent">

      <input
        placeholder="Enter OTP"
        [(ngModel)]="enteredOTP"
      />

      <input
        type="password"
        placeholder="New Password"
        [(ngModel)]="newPassword"
      />

      <button (click)="resetPassword()">Reset Password</button>

    </div>

    <button (click)="showForgotModal=false">Cancel</button>

  </div>

</div>
